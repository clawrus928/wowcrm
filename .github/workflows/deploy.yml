name: Deploy WOW CRM

# No push trigger: merging this repair must not deploy or publish an image.
on:
  workflow_dispatch:
    inputs:
      confirm_host:
        description: 'Enter 43.160.242.177 after reviewing the production preflight'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wowcrm-production
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Require master and an explicitly enabled production deployment
        env:
          DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          CONFIRM_HOST: ${{ inputs.confirm_host }}
        run: |
          test "$GITHUB_REF" = refs/heads/master
          test "$DEPLOY_ENABLED" = true
          test "$CONFIRM_HOST" = 43.160.242.177

  ci:
    needs: authorize
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record build timestamp
        id: metadata
        run: echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build immutable release
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/clawrus928/wowcrm:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.metadata.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify existing mount, back up SQLite, and deploy exact digest
        env:
          WOWCRM_IMAGE: ghcr.io/clawrus928/wowcrm@${{ steps.image.outputs.digest }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          WOWCRM_SSH_KNOWN_HOSTS: ${{ vars.WOWCRM_SSH_KNOWN_HOSTS }}
        run: bash scripts/ssh-deploy.sh
