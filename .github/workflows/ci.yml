name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Build and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run build
      - name: Check backend and deployment scripts
        run: |
          node --check server/src/index.js
          node --check server/src/db.js
          node --check server/src/validate.js
          bash -n scripts/ssh-deploy.sh
          python3 -m unittest discover -s tests -v
      - name: Exercise API with an isolated temporary SQLite database
        run: python3 scripts/smoke.py
      - name: Validate production Compose without starting containers
        env:
          WOWCRM_IMAGE: ghcr.io/clawrus928/wowcrm@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          JWT_SECRET: ci-only-not-a-production-secret
          DEFAULT_PASSWORD: ci-only-password
          API_KEY: ci-only-api-key
        run: docker compose --env-file /dev/null config --quiet
